name: CommunitySafe
options:
  bundleIdPrefix: app.communitysafe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "10"
    DEVELOPMENT_TEAM: 2S2MY5X9B9
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Manual
    ENABLE_BITCODE: NO

targets:
  CommunitySafe:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Core
      - path: Sources/Intents
      - path: Sources/App
      - path: Sources/Features
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: CommunitySafeWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.communitysafe
        PRODUCT_NAME: CommunitySafe
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/CommunitySafe.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: ""
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CommunitySafe App Store 2026-08"

  CommunitySafeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Core
      - path: Sources/Intents
      - path: Widget
      - path: Resources/Assets.xcassets
      # Must be bundled as exactly "PrivacyInfo.xcprivacy", so it lives in its
      # own directory rather than being renamed alongside the app's.
      - path: Resources/Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        # Was `app.communitysafe.widget`, which collides with the SEPARATE
        # "CommunitySafe: Area Grades" App Store product that owns that id.
        PRODUCT_BUNDLE_IDENTIFIER: app.communitysafe.gradewidget
        PRODUCT_NAME: CommunitySafeWidget
        INFOPLIST_FILE: Resources/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/CommunitySafeWidget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CommunitySafe GradeWidget App Store 2026-08"

schemes:
  CommunitySafe:
    build:
      targets:
        CommunitySafe: all
    run:
      config: Debug
    archive:
      config: Release
